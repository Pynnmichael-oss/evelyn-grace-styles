  <body>
    <!--
      Pairs with public/404.html — decodes the real path GitHub Pages
      redirected here (as ?p=/about) and swaps it back into the URL
      bar before React mounts, so BrowserRouter sees the right route.
    -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === 'p') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              decoded[0].slice(2) +
              (decoded[1] ? '?' + decoded[1].slice(2) : '') +
              l.hash
          )
        }
      })(window.location)
    </script>
    <div id="root"></div>
  </body>
